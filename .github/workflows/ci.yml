name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: Python ${{ matrix.python }} / Litestar ${{ matrix.litestar }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        litestar: ["latest"]
        include:
          # Lowest version allowed by pyproject.toml (litestar>=2.13,<3).
          - python: "3.10"
            litestar: "2.13.0"
          # First version with FromPath: the path parameter checks run from here on.
          - python: "3.10"
            litestar: "2.22.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8" "httpx>=0.27"
          if [ "${{ matrix.litestar }}" != "latest" ]; then
            python -m pip install "litestar==${{ matrix.litestar }}"
          fi
          python -m pip show litestar | head -2

      - name: Test
        run: python -m pytest
