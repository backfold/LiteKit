[project]
name = "litekit"
version = "0.1.0"
description = "SvelteKit-style file-based routing for Litestar"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "backfold" }]
keywords = ["litestar", "routing", "file-based-routing", "sveltekit", "asgi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: Litestar",
    "Framework :: Litestar :: 2",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
# Tested from 2.13 (CI). The path parameter name check needs FromPath (2.22+) and is
# skipped on older versions.
dependencies = ["litestar>=2.13,<3"]

[project.urls]
Homepage = "https://github.com/backfold/LiteKit"
Repository = "https://github.com/backfold/LiteKit"
Issues = "https://github.com/backfold/LiteKit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Litestar deprecations and LiteKit warnings fail the test run instead of scrolling by.
filterwarnings = ["error"]
