[project]
name = "litekit"
version = "0.0.1"
description = "SvelteKit-style file-based routing for Litestar"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "backfold" }]
keywords = ["litestar", "routing", "file-based-routing", "sveltekit", "asgi"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = ["litestar>=2.0"]

[project.urls]
Homepage = "https://github.com/backfold/LiteKit"
Repository = "https://github.com/backfold/LiteKit"
Issues = "https://github.com/backfold/LiteKit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
